services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-liriu}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-liriu}
      POSTGRES_DB: ${POSTGRES_DB:-liriu}
    ports:
      - "5432:5432"
    volumes:
      - liriu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-liriu}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      # Overrides .env's localhost DATABASE_URL with the in-network
      # hostname - the `db` service, not "localhost", is Postgres from
      # inside this compose network.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-liriu}:${POSTGRES_PASSWORD:-liriu}@db:5432/${POSTGRES_DB:-liriu}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

# The Next.js frontend (repo root) isn't included here - it isn't
# Dockerized yet and currently runs via `npm run dev` / a separate deploy.
# It would become a third service here once it does.
volumes:
  liriu_postgres_data:
